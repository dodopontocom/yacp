<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Mini App de física interativa com as ADAs do YACP.">

    <title>YACP · Física das ADAs</title>

    <link rel="icon" href="./image/cardano.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="./vendor/pako-2.1.0.min.js"></script>
    <script defer src="./vendor/lottie-5.13.0.min.js"></script>
    <script defer src="./vendor/matter-0.20.0.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</head>

<body>
    <main id="app">
        <div id="stage" role="img"
             aria-label="Simulação física das ADAs. Arraste os corpos com o dedo para interagir."></div>

        <div class="hud">
            <div class="hud-inner">
                <p id="status" class="status" aria-live="polite">
                    Toque em “Soltar as ADAs” para começar.
                </p>

                <div class="actions">
                    <button id="tilt" class="secondary" type="button"
                            aria-pressed="false" hidden>
                        Inclinar
                    </button>
                </div>

                <button id="toggle" class="action" type="button">Soltar as ADAs</button>
            </div>
        </div>
    </main>

    <noscript>
        <p class="noscript">Este Mini App precisa de JavaScript ativado para executar a simulação.</p>
    </noscript>
</body>
</html>
