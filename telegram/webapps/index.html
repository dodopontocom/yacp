<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0f1115">
    <meta name="description" content="Tetra-Zen, um jogo de física e blocos para o Telegram Mini App do YACP.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Tetra-Zen · YACP</title>

    <link rel="icon" href="./image/tetra.svg?v=20261114-4" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css?v=20261114-4">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="./vendor/matter-0.20.0.min.js?v=20261114-4"></script>
    <script type="module" src="./js/app.js?v=20261114-4"></script>
</head>

<body>
    <main id="app" class="app">
        <canvas id="game" class="game"
                aria-label="Campo de jogo Tetra-Zen. Arraste as peças, toque para girar e deslize para baixo para soltar."></canvas>

        <div class="hud">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-blocks"></use>
                        </svg>
                    </span>
                    <span class="brand-title">TETRA-ZEN <span class="brand-version">2.0</span></span>
                </div>

                <div class="top-actions">
                    <button id="mode" class="pill" type="button" aria-pressed="false"
                            aria-label="Modo Zen ativo. Alternar para Score Attack."
                            title="Modo Zen ativo. Alternar para Score Attack.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use id="mode-icon-use" href="#icon-leaf"></use>
                        </svg>
                        <span id="mode-label" class="pill-label">Modo Zen</span>
                    </button>

                    <button id="sound" class="pill pill-icon" type="button" aria-pressed="true"
                            aria-label="Som ligado. Desligar som." title="Som ligado. Desligar som.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use id="sound-icon-use" href="#icon-volume-2"></use>
                        </svg>
                    </button>

                    <button id="tilt" class="pill pill-icon" type="button" aria-pressed="false"
                            aria-label="Ativar inclinação." title="Ativar inclinação." hidden>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-smartphone"></use>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="score-wrap" class="score-wrap" hidden>
                <div class="score-pill">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>
            </div>

            <div id="hint" class="hint">
                <span>Arraste as peças, toque para girar, deslize para baixo para soltar</span>
            </div>

            <footer class="bottombar">
                <div class="toolbar">
                    <button id="gravity" class="pill pill-icon" type="button" aria-pressed="false"
                            aria-label="Gravidade lateral." title="Gravidade lateral.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-arrow-left-right"></use>
                        </svg>
                    </button>

                    <button id="zero-g" class="pill pill-icon" type="button" aria-pressed="false"
                            aria-label="Flutuar em gravidade zero." title="Flutuar em gravidade zero.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-orbit"></use>
                        </svg>
                    </button>

                    <button id="reset" class="pill pill-icon" type="button"
                            aria-label="Reiniciar pilha." title="Reiniciar pilha.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-rotate-ccw"></use>
                        </svg>
                    </button>

                    <button id="drop" class="pill pill-primary" type="button"
                            aria-label="Soltar próxima peça." title="Soltar próxima peça.">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="#icon-arrow-down"></use>
                        </svg>
                        <span>Soltar</span>
                    </button>
                </div>
            </footer>
        </div>

        <div id="round-over" class="modal" hidden>
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="round-over-title">
                <p id="round-over-title" class="eyebrow">Fim de rodada</p>
                <p id="final-score" class="modal-score">0</p>
                <p class="modal-copy">Melhor da sessão: <strong id="best-score">0</strong></p>
                <p class="modal-copy">Sua pilha chegou ao topo.</p>
                <button id="play-again" class="modal-button" type="button">Jogar de novo</button>
            </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <symbol id="icon-blocks" viewBox="0 0 24 24">
                <rect width="7" height="7" x="14" y="3" rx="1"></rect>
                <path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"></path>
            </symbol>
            <symbol id="icon-leaf" viewBox="0 0 24 24">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
            </symbol>
            <symbol id="icon-trophy" viewBox="0 0 24 24">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </symbol>
            <symbol id="icon-volume-2" viewBox="0 0 24 24">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
                <path d="M16 9a5 5 0 0 1 0 6"></path>
                <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path>
            </symbol>
            <symbol id="icon-volume-x" viewBox="0 0 24 24">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
                <line x1="22" x2="16" y1="9" y2="15"></line>
                <line x1="16" x2="22" y1="9" y2="15"></line>
            </symbol>
            <symbol id="icon-smartphone" viewBox="0 0 24 24">
                <rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect>
                <path d="M12 18h.01"></path>
            </symbol>
            <symbol id="icon-arrow-left-right" viewBox="0 0 24 24">
                <path d="M8 3 4 7l4 4"></path>
                <path d="M4 7h16"></path>
                <path d="m16 21 4-4-4-4"></path>
                <path d="M20 17H4"></path>
            </symbol>
            <symbol id="icon-orbit" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <circle cx="19" cy="5" r="2"></circle>
                <circle cx="5" cy="19" r="2"></circle>
                <path d="M10.4 21.9a10 10 0 0 0 9.941-15.416"></path>
                <path d="M13.5 2.1a10 10 0 0 0-9.841 15.416"></path>
            </symbol>
            <symbol id="icon-rotate-ccw" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </symbol>
            <symbol id="icon-arrow-down" viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="m19 12-7 7-7-7"></path>
            </symbol>
        </svg>
    </main>

    <noscript>
        <p class="noscript">Este Mini App precisa de JavaScript ativado para executar o jogo.</p>
    </noscript>
</body>
</html>
